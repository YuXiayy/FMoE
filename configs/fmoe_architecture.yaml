# Architecture-only configuration for the released F-MoE model.
model:
  inp_channels: 4
  out_channels: 4
  dim: 48
  levels: 4
  heads: [1, 2, 4, 8]
  num_blocks: [4, 6, 6, 8]
  num_dec_blocks: [2, 4, 4]
  ffn_expansion_factor: 2
  num_refinement_blocks: 4
  LayerNorm_type: WithBias
  bias: false

  num_experts: 4
  input_freq_bins: 520
  expert_embed_dims: [48, 64, 96, 128]
  expert_num_bands: [16, 24, 32, 48]
  expert_depths: [1, 2, 3, 4]
  expert_num_heads: [2, 4, 4, 8]

  sample_rate: 44100
  n_fft: 1024
  degradation_embed_dim: 128
  routing_balance_ema_decay: 0.99
  enable_routing_logging: false
  profile_expert_flops: false

audio_frontend:
  representation: complex
  complex_channel_order: [Re_L, Im_L, Re_R, Im_R]
  sample_rate: 44100
  segment_seconds: 5.0
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  center: true
  padded_frequency_bins: 520
  inference_overlap_ratio: 0.25
